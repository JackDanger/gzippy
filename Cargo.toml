[workspace]
members = ["crates/gzippy-inflate"]
resolver = "2"

[package]
name = "gzippy"
version = "0.8.0"
edition = "2021"
description = "The fastest parallel gzip. Drop-in replacement for gzip and pigz, and a Rust library."
license = "Zlib"
repository = "https://github.com/jackdanger/gzippy"
homepage = "https://github.com/jackdanger/gzippy"
documentation = "https://docs.rs/gzippy"
readme = "README.md"
keywords = ["gzip", "compression", "parallel", "pigz", "zlib"]
categories = ["compression", "command-line-utilities"]
authors = ["Jack Danger Canty"]
build = "build.rs"
include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CLAUDE.md",
    "rust-toolchain.toml",
]

# Lint levels applied package-wide to every target (lib, bin, tests, benches,
# examples). Flipping `default` to `pure-rust-inflate` brought the large
# pure-Rust parallel-decode engine into the bare `cargo clippy --all-targets`
# lint gate for the first time. These lints fire on INTENTIONAL, perf-deliberate
# patterns in the hot decode/table-build code (index loops over parallel arrays,
# hand-rolled clamps/memcpy/div in the bit-twiddling kernels) and on doc-comment
# formatting — they are pre-existing style, not correctness issues, so they are
# allowed here rather than rewriting hot loops (which risks the byte-exact
# contract). Real correctness/clarity lints stay enabled.
[lints.clippy]
needless_range_loop = "allow"
manual_clamp = "allow"
manual_memcpy = "allow"
manual_checked_ops = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
explicit_counter_loop = "allow"
if_same_then_else = "allow"
unusual_byte_groupings = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"

[lib]
name = "gzippy"
path = "src/lib.rs"

[[bin]]
name = "gzippy"
path = "src/main.rs"

[features]
# The pure-Rust parallel single-member decoder (the `parallel_sm` cfg, emitted
# by `pure-rust-inflate`) is the SOLE production decode path: every build —
# including the bare `cargo build` / lint gate — compiles the parallel module and
# decodes ALL gzip formats (single-member, multi-member, BGZF, raw DEFLATE) via
# pure-Rust with NO C-FFI in the decode graph. The legacy serial libdeflate/
# zlib-ng one-shot single-member path and the ISA-L FFI decode path have been
# removed. (C-FFI remains ONLY for COMPRESSION — ISA-L/libdeflate/zlib-ng — and
# behind dev/test code as differential oracles.)
default = ["pure-rust-inflate"]
isal = []  # ISA-L decompression (enabled by build.rs when static lib is built)
# NO-OP since Increment 7. Historically this gated the pure-Rust DEFLATE encoder
# onto the T1/T>1 routing alongside the C-FFI backends. As of Inc7 the pure-Rust
# encoder is the SOLE production compress path unconditionally, so this feature
# gates nothing. Retained as a defined (harmless) feature so any external
# `--features pure-rust-encoder` invocation still resolves.
pure-rust-encoder = []
# ── Increment 7: differential-oracle C-FFI COMPRESSORS ────────────────────────
# The pure-Rust DEFLATE encoder is the SOLE production compress path. The legacy
# C-FFI compressors (flate2/zlib-ng streaming, libdeflate one-shot + "GZ"
# multi-block ParallelGzEncoder, the SimpleOptimizer dispatcher, and the
# PipelinedGzEncoder flate2 dictionary path) are removed from the production
# routing graph but kept COMPILABLE behind this dev feature so the differential
# oracle tests can assert the pure engine roundtrips through — and is no larger
# than — the reference encoders at matched level. The shipped binary builds
# WITHOUT `ffi-oracle`, so the default `cargo build` links ZERO FFI compressor.
# (ISA-L compression is separately gated on `isal-compression`; DECODE FFI is a
# distinct, always-available differential oracle and is out of scope here.)
ffi-oracle = []
isal-compression = ["isal-rs", "arena-allocator"]  # ISA-L + parallel SM chunk arenas
trace = []  # Enable decode tracing instrumentation
# Coz causal profiling: wires fulcrum::probe scopes/progress into the
# parallel-SM decode so `coz run` can measure per-region wall-elasticity
# (∂wall/∂speed). OFF by default — no fulcrum dep, probes compile to no-ops.
# Build with `--features pure-rust-inflate,coz`. The in-process drive loop
# that used to live at `examples/coz_bench.rs` (looping
# `decompress::parallel::single_member::decompress_parallel` under `coz run`
# so enough progress-point visits accumulate) was deleted 2026-07-25 as part
# of the measurement-tooling-boundary migration (gzippy keeps knobs/counters,
# drivers move to fulcrum or are deleted as superseded) — it served a
# decode-campaign question that is now settled. Reviving Coz-driven
# measurement is a fresh fulcrum subcommand using the SAME in-process-gzippy
# path dependency the macOS `macmeasure` family already uses (fulcrum's
# `Cargo.toml`), not a resurrection of this file.
coz = ["dep:fulcrum", "fulcrum/coz"]
profile = []  # Enable timing profiler (adds overhead, only use for profiling)
debug_decode = []  # Log decode operations around DEBUG_POS (e.g., DEBUG_POS=124088477)
counters = []     # Enable AtomicU64 hot-path counters in bgzf (always on in test builds)
# Semantic-work-unit counters for `fulcrum anatomy`'s execution level (see
# src/compress/deflate/anatomy_counters.rs). DEFAULT OFF: with the feature
# off, every counter/call site compiles to nothing (verified byte-identical
# release binary vs the feature-off baseline). With the feature on, gzippy
# prints one line to stderr at process end: `ANATOMY_COUNTERS={json}`. No env
# var gates behavior (measurement-output only), consistent with "NO env vars
# in the production path" — this module does not exist in a default build.
anatomy-counters = []
# Wall-clock phase timers for `fulcrum anatomy`'s execution level (see
# src/compress/deflate/anatomy_wall.rs) — the sibling of `anatomy-counters`
# that answers "where does the TIME go" instead of "how much semantic work
# happened": `anatomy-counters` is exact WORK VOLUME (probe attempts, table
# reads, tokens pushed) but never reports time; cachegrind Ir-share
# (`fulcrum anatomy --exec`) is WEAK whole-program attribution. This feature
# adds region-granularity (per-block, never per-position) `Instant`-based
# timers around match-finding/parsing, Huffman table construction, Huffman
# symbol encoding, and CRC, plus a root span and a derived RESIDUAL bucket
# ("everything else") so every nanosecond is accounted for. DEFAULT OFF: with
# the feature off, every timer call site compiles to nothing (verified
# byte-identical release binary vs the feature-off baseline). With the
# feature on, gzippy prints one line to stderr at process end:
# `ANATOMY_WALL={json}`. No env var gates behavior, consistent with "NO env
# vars in the production path".
anatomy-wall = []
# ── Bucket-split-oracle session (2026-07-26) ────────────────────────────────
# The `parse_match` anatomy-wall bucket is FUSED (probe + accept/defer +
# `Sink::push_*` emission + histogram/stats all inlined in one per-position
# loop body with no call boundary that isn't per-position -- see
# `parse/greedy.rs:45-53`, `parse/lazy.rs:61-64`, `parse/gated.rs:391-399`
# and this module's own doc comment). A wall-clock read is materially more
# expensive than the position work itself (measured, see `anatomy_wall.rs`),
# so sub-region timing INSIDE the fused loop is not attempted. These three
# features instead sub-divide via ELIMINATION ORACLE: each stubs OUT one
# region's real work while leaving the surrounding control flow bit-for-bit
# intact, so `parse_match_ns` (the SAME existing per-block timer, unchanged)
# measures the fused loop with that one region's cost removed. The DELTA vs
# a feature-off run bounds that region's contribution. DEV-ONLY / DEFAULT
# OFF: with all three off, every stub call site compiles to nothing
# (verified byte-identical release binary vs baseline). Output is NOT
# byte-identical to a real compress when any of these are ON (expected --
# these are measurement ORACLES, not alternate production paths); each
# still produces a valid, roundtrippable (if smaller/larger/lossy) gzip
# stream -- see the bucket-split-oracle session report for exactly what
# differs. At most ONE of these three should be enabled at a time; enabling
# more than one is untested and its number would be meaningless.
#
# `bucket-oracle-null-mf`: `HcMatchfinder::longest_match` (matchfinder/hc.rs)
# returns "no match" immediately, before touching any hash/chain table --
# the DEGENERATE matchfinder Task B's ceiling oracle calls for. Because no
# match is ever found, the accept/defer DECISION code (the lazy parser's
# `better_match`/lookahead branches) never executes either -- this oracle
# therefore bounds PROBE + DECISION jointly, not probe alone (they are not
# separable by elimination without also removing the reason decision runs).
bucket-oracle-null-mf = []
# `bucket-oracle-no-histogram`: `Sink::push_literal`/`push_match`
# (parse/mod.rs) skip the `litlen_freqs`/`offset_freqs` increments and
# `BlockSplitStats::observe_*`, but still push the real token
# (`push_seq`)/litrun/block_length bookkeeping. Bounds histogram/stats-update
# cost. NOTE: `continue_block`'s block-split decision reads these same
# frozen-at-zero stats, so block boundaries (not total position count) may
# shift under this oracle -- a secondary confound, disclosed not hidden.
bucket-oracle-no-histogram = []
# `bucket-oracle-no-emission`: `Sink::push_literal`/`push_match` keep the
# real histogram/stats updates but skip the token write (`push_seq`) and
# litrun/block_length bookkeeping. Bounds sink-emission cost. Output tokens
# are incomplete (a real decoder would not reconstruct the full input) --
# expected for an elimination oracle, see the feature-group doc above.
bucket-oracle-no-emission = []
# L1-band ratio-close-out empirical config-space search (2026-07-22 campaign).
# Runtime-tunable knobs for the L1 fast-path matchfinder (lazy-peek gate,
# insert-depth, block length, bucket2/chain/hash3 levers) so a local grid
# search can sweep configs WITHOUT rebuilding per candidate. DEFAULT OFF: with
# the feature off, every knob resolves to the EXISTING shipped consts at
# compile time (verified byte-identical release binary vs feature-off
# baseline) — this module does not exist in a default build, consistent with
# "NO env vars in the production path". See `src/compress/deflate/parse/
# fast.rs`'s `tune` submodule (`tune::parse_spec`/`tune::set`/`tune::get`) and
# the CLI's `--tune key=val,...` flag (`src/cli.rs`, `src/main.rs`) — the
# sweep-driver channel. The in-process config-space sweep driver that used to
# live at `examples/l1_search.rs` (corpus generation, the named-config grid,
# breadth/file/filemt reporting) was ported to `fulcrum l1search` 2026-07-25
# (measurement-tooling-boundary migration): it shells out to an
# `l1-tune`-built gzippy with `--tune` per candidate instead of looping
# `tune::set` in one process. `GZIPPY_L1TUNE_*` env vars (`tune::from_env`)
# still work for local manual overrides but are no longer the sweep driver's
# channel.
l1-tune = []
# L3-STRATEGY experiment (2026-07-23 residual-diagnosis mission): routes L3
# through the SAME lazy parser used unmodified by L5-7 (`Strategy::Lazy` ->
# `lazy::run`) instead of `Strategy::Greedy`, with L3's `max_search_depth`/
# `nice_match_length` knobs UNCHANGED — isolates the accept-vs-defer decision
# from finder reach. DEFAULT OFF: with the feature off, L3 resolves to the
# EXISTING shipped `Strategy::Greedy` arm at compile time (verified
# byte-identical release binary vs feature-off baseline). See
# `src/compress/deflate/level.rs`'s level-3 arm and
# ~/www/gzippy-bench/l3_diag/l3_diag_notes.txt (the diagnosis this tests).
#
# RE-GATED 2026-07-23 under a strict-Pareto promotion rule (size <= current
# default on every breadth file, zero larger) — FAILED (ecoli.fastq,
# weights.safetensors regress), cross-arch-confirmed deterministic, so NOT
# promoted. Stays default-off, kept for provenance per the l1-tune precedent.
l3-tune = []
# LADDER FRONTIER SWEEP (2026-07-31). Measurement-only. Makes the level->params
# map overridable so the (strategy, max_search_depth, nice_match_length) frontier
# can be OBSERVED instead of inherited. It exists because a full size census showed
# our table IS libdeflate's at L2 and L4-L9: 154 of 198 T1 cells vs libdeflate are
# an EXACT BYTE TIE, so our size margin there is zero BY CONSTRUCTION and every T>1
# seam cost fails a cell outright. Finding a config that is both smaller and cheaper
# requires points libdeflate never chose, i.e. points only a sweep can supply.
# DEFAULT OFF; compiles to nothing when off; marks the binary +INSTRUMENTED so
# scripts/campaign/board-wall.sh refuses to quote a wall number from it.
# NOT a production knob (CLAUDE.md non-negotiable #3): the deliverable is a static
# table, and this feature must never be enabled in a shipped build.
ladder-tune = []
# EXACT LENGTH-LIMITED HUFFMAN for the L2-L9 block coder (2026-07-31 probe).
# `fast.rs` is libdeflate's HEURISTIC length-limiter (build_tree +
# compute_length_counts); `optimal.rs` already holds the EXACT Katajainen
# package-merge builder, but only deflate64/ultra/near_optimal call it. This
# feature routes the mainline block coder through the exact builder. Motivation:
# the size census shows we are an exact byte tie with libdeflate at L2 and L4-L9,
# so we need ~0.01% of margin at seven levels at once for ~zero wall — and unlike
# a parse change, Huffman construction is paid ONCE PER BLOCK, not per position.
# DEFAULT OFF; marks the binary +INSTRUMENTED so no wall number can be quoted from
# it against a rival.
exact-huffman = []
# Compile vendored C zopfli for the corpus oracle test that compares
# zopfli_pure deflate output byte-for-byte against the C reference.
# Only consumed by `cargo test --features oracle` (or `make oracle-vs-c`);
# does not affect production binaries. See plan.md Phase 11.2.
oracle = []
# Pure-Rust resumable inflate with stopping points (Track B); no ISA-L in wrapper body.
# Pulls `asm-kernel` (DEFAULT-ON since the §9 F-c SHIP + the four flip
# preconditions, plans/asm-campaign.md §10): every production decode build
# enables `pure-rust-inflate`, so this is the default-flip wire. Non-Linux and
# non-x86_64 builds are bit-for-bit unaffected (every kernel call site is
# compile-gated on the build.rs `asm_kernel` cfg = feature + x86_64 + Linux;
# Darwin x86_64 cannot compile the 15-GPR asm region — rbp is reserved).
pure-rust-inflate = ["rpmalloc-caches", "asm-kernel"]
# ── ASM campaign (plans/asm-campaign.md) ─────────────────────────────────────
# Rung (c): the contig clean fast loop's per-symbol hot path as ONE asm!
# region (asm_kernel.rs) — seam amortized to ~once per fast-loop run (the
# increment-(a) falsifier's mechanism). Linux-x86_64-only (compile-gated per
# call site via the build.rs `asm_kernel` cfg — the asm names 15 GPRs, which
# does not allocate on Darwin where rbp is the reserved frame pointer);
# runtime-dispatched (BMI2 detect) with the GZIPPY_ASM_KERNEL=0
# kill-switch; the pure-Rust loop is ALWAYS compiled and is the sole path on
# every other arch/CPU. DEFAULT-ON via `pure-rust-inflate` since the §9 F-c
# SHIP gate + §10 flip preconditions (T1 silesia -19.2% vs base, byte-exact,
# asm_frac 0.998); the kill-switch and the BMI2 runtime fallback stay.
asm-kernel = []
# ── Phase-2 two-path decode (2026-06-06) ──────────────────────────────────────
# gzippy-native (intended DEFAULT production once parallel-module lint debt is
# cleared): ONE unified pure-Rust decode engine, NO C-FFI in the DECODE graph, on
# every arch. It is a pure alias of `pure-rust-inflate`, so a native build is
# byte-identical to today's shipped decode. NOTE: the FFI-free mandate is
# DECODE-ONLY — x86_64 release builds may still ADD `isal-compression` on the
# command line for the ISA-L *compression* backend (T1 L0–L3); that is layered by
# the build/CI scripts per-target, NOT pulled here, so arm64 native stays C-free.
gzippy-native = ["pure-rust-inflate"]
arena-allocator = ["dep:allocator-api2", "dep:rpmalloc-sys"]
# Allocator-visibility tooling: enable rpmalloc's ENABLE_STATISTICS so
# dump_global_stats() reports mapped_total / unmapped_total / cached /
# huge_alloc_peak — i.e. whether segments are warm-reused (span cache) or
# re-mapped (faults). Measurement only; dump gated at runtime by
# GZIPPY_RPMALLOC_STATS.
rpmalloc-stats = ["arena-allocator", "rpmalloc-sys/statistics"]
# The rpmalloc span-cache TUNING KNOBS (the lever): global cache for
# cross-thread span reuse + thread cache + adaptive sizing. Toggleable so
# they can be A/B'd against the default rpmalloc-sys build.
rpmalloc-caches = [
    "arena-allocator",
    "rpmalloc-sys/global_cache",
    "rpmalloc-sys/thread_cache",
    "rpmalloc-sys/adaptive_thread_cache",
]
# Activates `#[global_allocator] = rpmalloc::RpMalloc` in src/main.rs.
# Test for the "pipeline idle is allocator contention" hypothesis.
global-rpmalloc = ["dep:rpmalloc"]
libdeflate = []
# streaming-libdeflate-rs / dynasm / dynasmrt / route-c-dynasm (Route A pure-
# Rust libdeflate port bake-off + Route C per-block dynasm-emitted x86_64
# inflate, `plans/unified-decoder.md` §3.1/§4.3/§5.1 — that plans/ file no
# longer exists) were REMOVED 2026-07-25: their sole consumers were
# `examples/bench_route_a.rs` and `examples/testbed_silesia.rs`, both deleted
# as superseded/abandoned explorations (the shipped decode path is the
# pure-Rust asm-kernel engine in `src/decompress/inflate/`, not either Route).
# `crates/gzippy-inflate`'s own `route-c-dynasm` feature/modules are a
# separate, still-standalone concern (unaffected, out of scope here).

[dependencies]
# Causal profiler probes (optional; pulled ONLY under --features coz, which is
# never enabled by default/CI builds — see the `coz` feature). Declared as a GIT
# dep (not a `../fulcrum` path dep): cargo loads an optional path-dependency's
# manifest at RESOLVE time even when the feature is off, so a `path = "../fulcrum"`
# made every default/CI build fail (`failed to load manifest for dependency
# 'fulcrum'`) in checkouts without a sibling ../fulcrum. A git source resolves
# without a local checkout and is only fetched/compiled when `coz` is enabled.
# For local iteration ON fulcrum, override with an UNCOMMITTED patch in your
# .cargo/config.toml: [patch."https://github.com/JackDanger/fulcrum.git"]
#   fulcrum = { path = "../fulcrum" }
fulcrum = { git = "https://github.com/JackDanger/fulcrum.git", optional = true }
# Compression: flate2 with zlib-ng for maximum performance
# zlib-ng is a modernized fork with SIMD optimizations (2-3x faster)
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }

# Decompression: libdeflater provides Rust bindings to libdeflate
# (30-50% faster than zlib for in-memory operations)
libdeflater = "1.0"
# Low-level bindings for _ex functions (returns consumed bytes)
libdeflate-sys = "1.0"
# zlib-ng low-level API: inflatePrime for non-byte-aligned restart (parallel arm64)
libz-ng-sys = "1"

# ISA-L compression (optional, for fastest L0-L3 on x86)
isal-rs = { version = "0.5", optional = true }

# CLI and utilities
walkdir = "2.4"
filetime = "0.2"
num_cpus = "1.16"

# Memory-mapped I/O for zero-copy file access
memmap2 = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CRC32 (hardware-accelerated on ARM/x86)
crc32fast = "1.4"

# SIMD-accelerated byte searching (for fast gzip header detection)
memchr = "2.7"

# System utilities
core_affinity = "0.8"
libc = "0.2"
allocator-api2 = { version = "0.2", optional = true }
rpmalloc-sys = { version = "0.2", optional = true }
# Global rpmalloc allocator — vendor parity test. Gated behind
# `global-rpmalloc` feature; only activated for the perf experiment.
rpmalloc = { version = "0.2", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
# Property-based + fuzz-loop differential testing of the pure-Rust inflate path
# (src/tests/inflate_proptest.rs, src/tests/inflate_fuzz_loop.rs). Default
# features (rand-based generation + shrinking); no extra transitive C deps.
proptest = "1"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
# gzippy-inflate dev-dependency REMOVED 2026-07-25: its sole consumer was
# `examples/testbed_silesia.rs` (deleted as a superseded/abandoned Route C
# dynasm exploration — see the `route-c-dynasm` feature comment above). The
# `crates/gzippy-inflate` workspace member still builds standalone
# (`cargo build -p gzippy-inflate`); it is just no longer wired into the root
# crate's dev-dependency graph.
# Phase 0.6 spike: iai-callgrind for SIMD-fidelity test.
# See plans/inner-loop-execution.md Phase 0.6.
iai-callgrind = "0.13"
# Phase 1.2 microbench harness.
criterion = "0.5"

[[bench]]
name = "inflate_isal_vs_pure_rust"
harness = false
required-features = ["isal-compression"]

[[bench]]
name = "engine_isolation"
harness = false
required-features = ["pure-rust-inflate", "isal-compression"]

[[bench]]
name = "bootstrap_marker_overhead"
harness = false
required-features = ["pure-rust-inflate"]

[[bench]]
name = "iai_simd_spike"
harness = false

[[bench]]
name = "inflate_block"
harness = false
required-features = ["pure-rust-inflate"]

[[bench]]
name = "tight_huffman_baseline"
harness = false
required-features = ["pure-rust-inflate"]

[[bench]]
name = "alloc_pattern"
harness = false

[profile.release]
lto = "fat"           # Full cross-crate LTO (slower build, faster binary)
codegen-units = 1     # Single codegen unit for maximum optimization
panic = "abort"       # Smaller binary, no unwinding overhead
opt-level = 3         # Maximum optimization
strip = true          # Remove symbols for smaller binary

# iai-callgrind requires debug symbols to find its instrumented sentinels;
# the stripped release profile breaks it. Keep release-grade optimization
# but retain full debug info for cachegrind output parsing.
# LTO disabled here because iai-callgrind's sentinel-finder doesn't work
# well with fat LTO (sentinels can be merged across translation units).
[profile.bench]
inherits = "release"
strip = false
debug = true
lto = false

# Fast CORRECTNESS-test profile: release-grade opt (so the asm kernel + differential
# tests run fast on big corpora) but LTO OFF + parallel codegen + unwind, so the test
# harness BUILDS in ~1-2 min instead of the ~15-20 min fat-LTO release-test build.
# Correctness (byte-exact output) is opt-/LTO-independent, so this is a safe ~10x faster
# gate. Use: `cargo test --profile quicktest --no-default-features --features gzippy-native`.
# PERF (cyc/B) gating still uses the real `--release` binary.
[profile.quicktest]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = false
incremental = true

# Enable native CPU optimizations when building locally
# (commented out for portable binaries - uncomment for max local perf)
# [build]
# rustflags = ["-C", "target-cpu=native"]

# Patched isal-sys from vendor/isal-rs (JackDanger/isal-rs branch
# gzippy-stopping-points). C source via ISAL_SOURCE=vendor/isa-l (.cargo/config.toml).
# See packaging/isal-patches/.
[patch.crates-io]
isal-sys = { path = "vendor/isal-rs/isal-sys" }
